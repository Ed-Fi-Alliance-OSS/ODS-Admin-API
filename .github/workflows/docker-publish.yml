name: Docker Publish
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag (e.g., Pre-Release-v2.3.1-alpha.0.132 or v2.3.1)'
        required: true
        type: string
      publish-only-minor-image:
        description: 'Publish only the minor image (e.g., v2.3)'
        required: false
        type: boolean
        default: false
      publish-6x-image:
        description: 'Publish 6.x database image '
        required: false
        type: boolean
        default: false
      retag-only:
        description: 'Only repoint API image tags (e.g., latest, v2) to the existing release image; no build'
        required: false
        type: boolean
        default: false


env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  DATABASE_IMAGE_NAME: ${{ vars.DATABASE_IMAGE_NAME }}
  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

permissions: read-all

jobs:
  docker-publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: eng
          persist-credentials: false

      - name: Prepare Tags
        id: prepare-tags
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.ref }}
          MINOR_ONLY: ${{ inputs.publish-only-minor-image }}
        run: |
          set -euo pipefail

          # Pre-releases get the tag "pre". Releases get the version plus the
          # shortened minor (vX.Y) and major (vX) forms and "latest" for the API
          # image, each moving tag only when this is the highest release of its
          # group. See eng/docker-tags.sh, which also validates the release tag.
          args=(--ref "$RELEASE_REF" --api-image "$IMAGE_NAME" --db-image "$DATABASE_IMAGE_NAME")
          if [[ "$MINOR_ONLY" == "true" ]]
          then
            args+=(--minor-only)
          fi

          bash eng/docker-tags.sh "${args[@]}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Set up QEMU
        if: inputs.retag-only != true
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Retag API image (no rebuild)
        if: inputs.retag-only == true
        shell: bash
        env:
          ALIASES: ${{ steps.prepare-tags.outputs.APITAGS_ALIASES }}
          SOURCE_TAG: ${{ steps.prepare-tags.outputs.VERSION_TAG }}
        run: |
          set -euo pipefail

          SOURCE="${IMAGE_NAME}:${SOURCE_TAG}"

          if [[ -z "$ALIASES" ]]
          then
            echo "Nothing to retag for ${SOURCE}: pre-release refs and minor-only publishes have no moving tags, and a release that is not the highest of its group moves none." >&2
            exit 1
          fi

          if ! docker buildx imagetools inspect "$SOURCE" > /dev/null
          then
            echo "Source image ${SOURCE} was not found in Docker Hub; publish it first." >&2
            exit 1
          fi

          tag_args=()
          IFS=',' read -ra TAGS <<< "$ALIASES"
          for tag in "${TAGS[@]}"
          do
            tag_args+=(-t "$tag")
          done

          # Repoints the tags at the existing manifest list in the registry:
          # no rebuild, all platforms preserved, same digest as the source.
          docker buildx imagetools create "${tag_args[@]}" "$SOURCE"
          docker buildx imagetools inspect "${TAGS[0]}"

      - name: Extract metadata (tags, labels) for admin api image
        id: metaapi
        if: inputs.retag-only != true
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.version=${{ steps.prepare-tags.outputs.VERSION_TAG }}

      - name: Build and push admin api image
        if: inputs.retag-only != true
        uses: docker/build-push-action@b32b51a8eda65d6793cd0494a773d4f6bcef32dc  # v6.11.0
        with:
          context: "{{defaultContext}}:Docker"
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:pre
          cache-to: type=inline
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.prepare-tags.outputs.VERSION }}
            ADMIN_API_VERSION=${{ steps.prepare-tags.outputs.VERSION }}
          file: api.pgsql.Dockerfile
          tags: ${{ steps.prepare-tags.outputs.APITAGS }}
          labels: ${{ steps.metaapi.outputs.labels }}
          push: true

      - name: Extract metadata (tags, labels) for admin api database image
        id: metadatabase
        if: inputs.retag-only != true
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.DATABASE_IMAGE_NAME }}

      - name: Build and push admin api database image 7.x
        if: inputs.retag-only != true
        uses: docker/build-push-action@b32b51a8eda65d6793cd0494a773d4f6bcef32dc  # v6.11.0
        with:
          context: "{{defaultContext}}:Docker/Settings/V2/DB-Admin/pgsql"
          build-contexts: |
            shared={{defaultContext}}:Docker
          cache-from: type=registry,ref=${{ env.DATABASE_IMAGE_NAME }}:pre
          cache-to: type=inline
          platforms: linux/amd64,linux/arm64
          build-args: ADMIN_API_VERSION=${{ steps.prepare-tags.outputs.VERSION }}
          file: Dockerfile
          tags: ${{ steps.prepare-tags.outputs.DBTAGS }}
          labels: ${{ steps.metadatabase.outputs.labels }}
          push: true

      - name: Build and push admin api database image 6.x
        uses: docker/build-push-action@b32b51a8eda65d6793cd0494a773d4f6bcef32dc  # v6.11.0
        if: inputs.publish-6x-image == true && inputs.retag-only != true
        with:
          context: "{{defaultContext}}:Docker/Settings/V1/DB-Admin/pgsql"
          cache-from: type=registry,ref=${{ env.DATABASE_IMAGE_NAME }}:pre-for-6.2
          cache-to: type=inline
          platforms: linux/amd64,linux/arm64
          build-args: ADMIN_API_VERSION=${{ steps.prepare-tags.outputs.VERSION }}
          file: Dockerfile
          tags: ${{ steps.prepare-tags.outputs.DBTAGS6x }}
          labels: ${{ steps.metadatabase.outputs.labels }}
          push: true
