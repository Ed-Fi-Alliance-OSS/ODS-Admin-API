name: On Pull Request

on:
  pull_request:
    branches:
      - main
      - "*-hotfix"
    paths:
      # TODO: restore this with AA-1601, except run in a PS-specific
      # workflow, so that the C# build and CodeQL do not run
      # unnecessarily.
      # - "**/*.ps1"
      # - "**/*.psm1"
      - "**/*.cs"
      - "**/*.csproj"
      - "**/packages.lock.json"
      - ".github/**/*.yml"
  workflow_dispatch:

permissions: read-all

jobs:
  scan-actions-bidi:
    name: Scan Actions, scan all files for BIDI Trojan Attacks
    uses: ed-fi-alliance-oss/ed-fi-actions/.github/workflows/repository-scanner.yml@8fc2302d7369828b2f0784f8ca219c7da228b583
    with:
      config-file-path: ./.github/workflows/bidi-config.json

  dependency-review:
    name: Dependency Review ("Dependabot on PR")
    # The action derives base and head refs only from pull_request events; a manual dispatch would fail.
    if: github.event_name == 'pull_request' && !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # DEVOPS-162: post the vulnerability summary as a PR comment
    steps:
      - name: Checkout the Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fork heads get a read-only token; the action would only log a warning, so skip the comment there.
          comment-summary-in-pr: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'always' || 'never' }}
          show-patched-versions: true

  run-cs-tests:
    name: Run C# Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify NuGet lock files are up to date
        run: dotnet restore Application/Ed-Fi-ODS-AdminApi.sln --locked-mode

      - name: Build
        run: ./build.ps1 -Command Build -Configuration Debug

      - name: Install Coverlet Tools
        if: success()
        run: |
          dotnet tool install --global coverlet.console --version 10.0.1
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.10

      - name: Run Unit Tests
        if: success()
        run: ./build.ps1 -Command UnitTest -NoBuild -Configuration Debug -RunCoverageAnalysis

      - name: Write unit test summary
        if: always()
        run: ./eng/write-test-summary.ps1 -Path "Application/*.UnitTests/*.csproj.trx" -Title "Unit tests"

      - name: Write coverage summary
        if: success()
        run: |
          $summary = "coveragereport/SummaryGithub.md"
          if (Test-Path $summary) {
            Get-Content $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          else {
            "Coverage summary not found at $summary" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Coverage Report
          path: coveragereport

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csharp-tests
          path: "**/*.trx"
          retention-days: 5

      - name: Initialize CodeQL
        if: success()
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: csharp, actions

      # Must build the software after initialization of CodeQL; something about
      # CodeQL initialization causes the resulting build to fail unit tests.
      # Therefore rebuilding here, even though also built above.
      - name: Build
        run: ./build.ps1 -Command Build -Configuration Debug

      - name: Perform CodeQL Analysis
        if: success()
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

      - name: Upload built application
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-application
          # Exclude the unit test results: After Pull Request globs every artifact for *.trx,
          # and copies here were counted as a second (and, via the integration job, a third) run.
          path: |
            Application
            !Application/**/*.trx
          retention-days: 1

  run-integration-tests:
    name: Run integration tests
    needs: run-cs-tests
    env:
      DB_Password: P@55w0rd
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: pwsh
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server@sha256:d7f2c670f0cd807b4dc466b8887bd2b39a4561f624c154896f5564ea38efd13a
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: ${{ env.DB_Password }}
          MSSQL_ENABLE_HADR: "1"
        ports:
          - 1433:1433
    steps:
      - name: Checkout the Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download built application
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-application
          path: Application

      # The downloaded build output references NuGet packages by path in the local package
      # cache, which is empty on this fresh runner. Without a restore, MSBuild skips the
      # Microsoft.NET.Test.Sdk imports (Exists() conditions), IsTestProject is never set, and
      # `dotnet test --no-build` exits 0 without running or reporting anything.
      - name: Restore NuGet packages
        run: dotnet restore Application/Ed-Fi-ODS-AdminApi.sln --locked-mode

      - name: Run Integration Tests
        if: success()
        run: ./build.ps1 -Command IntegrationTest -NoBuild -Configuration Debug -UseIntegratedSecurity:$false -DbUsername "sa" -DbPassword ${{ env.DB_Password }}

      - name: Write integration test summary
        if: always()
        run: ./eng/write-test-summary.ps1 -Path "Application/*DBTests/*.csproj.trx" -Title "Integration tests"

      - name: Verify integration test results exist
        if: success()
        run: |
          $results = @(Get-ChildItem -Path "Application/*DBTests/*.csproj.trx" -File)
          if ($results.Count -eq 0) {
            throw "No integration test result files were produced. dotnet test ran without executing any tests."
          }
          Write-Host "Integration test result files: $($results.Count)"

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csharp-integration-tests
          path: "Application/*DBTests/*.csproj.trx"
          retention-days: 5

  event_file:
    name: "Event File"
    runs-on: ubuntu-latest
    steps:
    - name: Upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: Event File
        path: ${{ github.event_path }}
