name: Admin API V1 E2E Tests + ODS 6

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - "*-hotfix"

env:
  JIRA_ACCESS_TOKEN: ${{ secrets.JIRA_ACCESS_TOKEN }}
  ADMIN_API_VERSION: "1.2"
  PROJECT_ID: "13401"
  CYCLE_NAME: "Automation Cycle"
  TASK_NAME: "API Automation Task"
  FOLDER_NAME: "API Automation Run"
  RESULTS_FILE: "test-results"

permissions: read-all

jobs:
  run-e2e-tests:
    strategy:
      fail-fast: false
      matrix:
        dbEngine: [mssql, pgsql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Run Bruno tests
        shell: pwsh
        run: ./eng/run-bruno-e2e.ps1 -ApiVersion 1 -DbEngine ${{ matrix.dbEngine }} -ReportSuffix ${{ matrix.dbEngine }}

      - name: Get Docker logs
        if: failure()
        run: |
          mkdir -p docker-logs
          for container in adminapi ed-fi-db-admin-adminapi ed-fi-gateway-adminapi; do
            if docker inspect "$container" >/dev/null 2>&1; then
              docker logs "$container" > "docker-logs/$container.log" 2>&1 || true
            fi
          done
          if docker inspect adminapi >/dev/null 2>&1; then
            docker cp adminapi:/app/Ed-Fi-ODS-AdminAPI-Log.txt docker-logs/adminapi-app.log || true
          fi

      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-logs-v1-${{ matrix.dbEngine }}
          path: docker-logs/
          retention-days: 10
          if-no-files-found: ignore

      - name: Upload Html results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-html-results-v1-${{ matrix.dbEngine }}
          path: 'Application/EdFi.Ods.AdminApi/E2E Tests/V1/Bruno Admin API E2E refactor/results-${{ matrix.dbEngine }}.html'
          retention-days: 10
          if-no-files-found: warn

      - name: Upload xml results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-v1-${{ matrix.dbEngine }}
          path: 'Application/EdFi.Ods.AdminApi/E2E Tests/V1/Bruno Admin API E2E refactor/report-${{ matrix.dbEngine }}.xml'
          retention-days: 10
          if-no-files-found: error

  report:
    defaults:
      run:
        shell: pwsh
    if: success() || failure()
    needs:
      - run-e2e-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-results-v1-*
          path: test-results
          merge-multiple: true

      - name: Inspect results for JIRA report
        run: |
          $expectedReports = @('report-mssql.xml', 'report-pgsql.xml')
          $missingReports = @($expectedReports | Where-Object { -not (Test-Path (Join-Path 'test-results' $_)) })
          if ($missingReports.Count -gt 0) {
            throw "Missing expected XML reports: $($missingReports -join ', ')"
          }
          Get-ChildItem -Path 'test-results' -Recurse -Filter 'report-*.xml' | ForEach-Object {
            [xml]$xmlContent = Get-Content -Path $_.FullName
            $failed = [int]($xmlContent.testsuites.testsuite | Measure-Object -Property failures -Sum | Select-Object -ExpandProperty Sum)
            $passed = [int]($xmlContent.testsuites.testsuite | Measure-Object -Property tests -Sum | Select-Object -ExpandProperty Sum) - $failed
            if ($passed -lt 1) {
              Write-Output "No tests recorded in report ($($_.Name)). Uploading manually."
            }
            }
