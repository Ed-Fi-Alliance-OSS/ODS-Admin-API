name: On Pull Request - Dockerfile

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/on-pullrequest-dockerfile.yml"
      - "Docker/**"
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

permissions: read-all

jobs:
  docker-analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          [
            { name: "v2-api-database", path: "Docker/Settings/V2/DB-Admin/pgsql/Dockerfile", type: "published" },
            { name: "v3-api-database", path: "Docker/Settings/V3/DB-Admin/pgsql/Dockerfile", type: "published" },
            { name: "v1-api-database", path: "Docker/Settings/V1/DB-Admin/pgsql/Dockerfile", type: "published" },
            { name: "postgres", path: "Docker/api.pgsql.Dockerfile", type: "published" },
            { name: "v2-gateway", path: "Docker/Settings/V2/gateway/Dockerfile", type: "local" },
            { name: "v1-gateway", path: "Docker/Settings/V1/gateway/Dockerfile", type: "local" },
            { name: "v3-database", path: "Docker/V3/db.pgsql.admin.Dockerfile", type: "local" },
            { name: "v2-database", path: "Docker/V2/db.pgsql.admin.Dockerfile", type: "local" },
            { name: "v1-database", path: "Docker/V1/db.pgsql.admin.Dockerfile", type: "local" },
            { name: "development", path: "Docker/dev.pgsql.Dockerfile", type: "local" },
          ]
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set Version Numbers
        if: ${{ matrix.dockerfile.type == 'published' }}
        id: versions
        run: |
          FEED="9f7770ac-66d9-4fbc-b81e-b5ad79002b62"
          PACKAGE="db5612a0-336b-4960-9092-f3be0b63d13e"

          VERSIONS=$(curl "https://feeds.dev.azure.com/ed-fi-alliance/$FEED/_apis/Packaging/Feeds/EdFi/Packages/$PACKAGE")
          LATEST=$(echo "$VERSIONS" | jq -r '.versions[] | select(.isLatest == true) | .version')
          echo "latest version: $LATEST"
          echo "VERSION=$LATEST" >> "$GITHUB_OUTPUT"

      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        name: Run Linter on ${{ matrix.dockerfile.name }} Dockerfile
        with:
          dockerfile: ${{ matrix.dockerfile.path }}
          failure-threshold: error

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build
        run: |
          path=${{matrix.dockerfile.path}}
          folder=${path%/*}
          cd "$folder"
          dockerfile=$(echo "${{ matrix.dockerfile.path }}" | awk -F"/" '{print $NF}')

          lower_path=$(echo "${{ matrix.dockerfile.path }}" | tr '[:upper:]' '[:lower:]')
          build() {
            if [[ "${{ matrix.dockerfile.type }}" == "published" && "$lower_path" == *db-admin/pgsql* ]]
            then
              docker build -f "$dockerfile" -t "${{ matrix.dockerfile.name }}" --build-context shared=../../../../ --build-arg="ADMIN_API_VERSION=${{ steps.versions.outputs.VERSION }}" .
            elif [[ "$lower_path" == *v3* || "$lower_path" == *v2* || "$lower_path" == *v1* ]]
            then
              docker build -f "$dockerfile" -t "${{ matrix.dockerfile.name }}" --build-context assets=../.. --build-arg="ADMIN_API_VERSION=${{ steps.versions.outputs.VERSION }}" .
            else
              docker build -f "$dockerfile" -t "${{ matrix.dockerfile.name }}" --build-context assets=.. --build-arg="ADMIN_API_VERSION=${{ steps.versions.outputs.VERSION }}" .
            fi
          }

          # Retry only on transient registry errors (base image pulls); build errors fail at once.
          PATTERN='unexpected status|500 Internal Server Error|502 Bad Gateway|503 Service Unavailable|toomanyrequests|TLS handshake timeout|failed to resolve source metadata|connection reset by peer|unexpected EOF'
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::docker build (attempt $attempt of 3)"
            if build 2>&1 | tee build.log; then
              rc=0
            else
              rc=$?
            fi
            echo "::endgroup::"
            [ $rc -eq 0 ] && break
            if [ $attempt -eq 3 ] || ! grep -qiE "$PATTERN" build.log; then
              echo "::error::docker build failed (exit $rc) after $attempt attempt(s)"; exit $rc
            fi
            echo "::warning::Transient registry error during docker build; retrying"
            sleep $(( attempt == 1 ? 15 : 45 ))
          done

      - name: Analyze
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: local://${{ matrix.dockerfile.name }}
          sarif-file: sarif-${{ matrix.dockerfile.name }}.output.json
          summary: true
          write-comment: false # the image-summary job posts one table for all images

      - name: Upload SARIF result
        id: upload-sarif
        if: ${{ github.event_name != 'pull_request_target' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: sarif-${{ matrix.dockerfile.name }}.output.json

      - name: Upload Scout SARIF for the PR summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scout-${{ matrix.dockerfile.name }}
          path: sarif-${{ matrix.dockerfile.name }}.output.json
          retention-days: 5
          if-no-files-found: ignore

  image-summary:
    name: Image vulnerability summary
    needs: docker-analysis
    if: always()
    runs-on: ubuntu-latest
    # Serialize comment updates per PR so overlapping runs cannot post twice or overwrite newer results.
    concurrency:
      group: image-summary-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write # only this job comments on the PR
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download Scout SARIF files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: scout-*
          path: scout-sarif
          merge-multiple: true

      - name: Read image names from the docker-analysis matrix
        id: matrix
        run: |
          images=$(yq '.jobs.docker-analysis.strategy.matrix.dockerfile[].name' .github/workflows/on-pullrequest-dockerfile.yml | paste -sd, -)
          if [ -z "$images" ]; then
            echo "::error::Could not read the image names from the docker-analysis matrix"; exit 1
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"

      - name: Build summary
        shell: pwsh
        env:
          EXPECTED_IMAGES: ${{ steps.matrix.outputs.images }}
        run: |
          ./eng/write-image-summary.ps1 -SarifDir scout-sarif `
            -ExpectedImages ($env:EXPECTED_IMAGES -split ',') `
            -RunUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" `
            -OutputPath image-summary.md

      - name: Post or update PR comment
        # Fork heads have a read-only token. Advisory: the summary is already on the run page.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The script writes its marker comment as the first line of the summary.
          MARKER=$(head -n 1 image-summary.md)
          cid=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n 1)
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$cid" -F body=@image-summary.md --jq .html_url
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@image-summary.md --jq .html_url
          fi
